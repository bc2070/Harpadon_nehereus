[General]
job_type = local	# run tasks on local machine
job_prefix = nextDenovo	# prefix for output files
task = all	# run both correction and assembly
rewrite = yes # overwrite existing results
deltmp = yes	# delete intermediate temporary files
rerun = 3	# maximum retry attempts
parallel_jobs = 1	# number of concurrent jobs
input_type = raw	# input data format
read_type = ont	# sequencing technology
input_fofn = ./input.fofn	# path to input file list
workdir = ./01_rundir	# output directory

[correct_option]
read_cutoff = 1k	# filter reads shorter than 1kb
genome_size = 684.4m	# estimated genome size
pa_correction = 6	# threads for correction
sort_options = -m 40g -t 32	# memory and threads for sorting
minimap2_options_raw =  -t 32	# threads for raw read alignment
correction_options = -p 15	# parallel threads for correction

[assemble_option]
minimap2_options_cns =  -t 32	# threads for consensus alignment
nextgraph_options = -a 1	# graph construction parameters
