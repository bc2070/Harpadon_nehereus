[General]
job_type = local 	# run tasks on local machine
job_prefix = nextPolish 	# prefix for output files
task = best 	# run optimal polishing rounds
rewrite = yes 	# overwrite existing results
rerun = 3 	# maximum retry attempts
parallel_jobs = 1 	# number of concurrent jobs
multithread_jobs = 24 	# threads per task
genome = ./youwei_nd.asm.fasta 	# input assembly file
genome_size = auto 	# auto detect genome size
workdir = ./01_rundir 	# output directory
polish_options = -p {multithread_jobs} 	# threading configuration


[sgs_option] 
sgs_fofn = ./sgs.fofn 	# short read file list
sgs_options = -max_depth 100 -bwa 	# depth limit and mapper

[lgs_option] 
lgs_fofn = ./lgs.fofn 	# long read file list
lgs_options = -min_read_len 5k -max_depth 100	# filter and depth
lgs_minimap2_options = -x map-ont 	# mapping preset for ont

